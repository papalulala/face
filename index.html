<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>繪臉工作室</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ea;color:#202525;font:16px "Noto Sans TC",system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:36px 28px}header{border-bottom:1px solid #c8c6bc;margin-bottom:24px;padding-bottom:18px}h1{font-size:clamp(32px,6vw,56px);margin:0;letter-spacing:-.05em}p{margin:8px 0;color:#4f5754}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}section{border:1px solid #c8c6bc;border-radius:20px;background:#fffdf6;overflow:hidden}.heading,.tools{padding:14px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.heading{justify-content:space-between}h2{font-size:17px;margin:0}.stage{position:relative;aspect-ratio:4/3;background:#202b2a;overflow:hidden}.stage>*{position:absolute;inset:0;width:100%;height:100%}video{object-fit:contain;transform:scaleX(-1)}#notice{display:grid;place-content:center;text-align:center;padding:24px;color:#fffdf6;pointer-events:none}#notice:empty{display:none}.board{position:relative;aspect-ratio:4/3;background:#f0dbbe}.board canvas{position:absolute;width:100%;height:100%;inset:0}#paint{touch-action:none;cursor:crosshair}button,input{font:inherit}button{background:#fffdf6;border:1px solid #a9ada1;border-radius:9px;padding:7px 10px;color:inherit;cursor:pointer}button[aria-pressed=true],#camera{background:#c7ed85;border-color:#5b713c}button:disabled{opacity:.45;cursor:default}label{display:inline-flex;align-items:center;gap:5px}input[type=range]{width:82px;accent-color:#527332}input[type=color]{width:39px;height:34px;padding:2px}footer{padding:10px 16px;font-size:13px;color:#4f5754}@media(max-width:620px){main{padding:18px 10px}.grid{gap:7px}.heading,.tools{padding:8px;gap:5px}button{padding:5px;font-size:13px}footer,label{font-size:12px}}
</style></head><body><main><header><h1>繪臉工作室</h1><p>在右邊畫畫，看看筆跡如何跟著你的臉移動。</p></header>
<div class="grid"><section><div class="heading"><h2>即時鏡頭</h2><button id="camera">開啟鏡頭</button></div><div class="stage"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas><div id="notice" role="status">開啟鏡頭後，請正面看向鏡頭。</div></div><footer>鏡頭影像在你的裝置上處理。</footer></section>
<section><div class="heading"><h2>臉部畫布</h2><div><button id="undo" disabled>復原</button> <button id="clear" disabled>清空</button></div></div><div class="board"><canvas id="guide" width="640" height="480"></canvas><canvas id="paint" width="640" height="480" aria-label="臉部彩繪畫布"></canvas></div><div class="tools"><button data-brush="hard" aria-pressed="true">筆刷</button><button data-brush="soft" aria-pressed="false">柔邊</button><button data-brush="erase" aria-pressed="false">橡皮擦</button><label>顏色 <input aria-label="顏色" id="color" type="color" value="#cc3967"></label><label>粗細 <input aria-label="粗細" id="size" type="range" min="3" max="90" value="24"></label></div></section></div></main>
<script type="module" src="./app.js"></script></body></html>
